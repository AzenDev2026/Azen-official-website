<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NVazen · 搜索</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
      transition: background-color 0.2s ease, border-color 0.2s ease, color 0.2s ease, box-shadow 0.2s ease;
    }

    :root, .light {
      --bg-page: #f8fafc;
      --bg-surface: #ffffff;
      --bg-input: #ffffff;
      --bg-suggestion: #ffffff;
      --border-light: #e2e8f0;
      --border-focus: #3b82f6;
      --text-primary: #0f172a;
      --text-secondary: #475569;
      --text-muted: #94a3b8;
      --btn-bg: #f1f5f9;
      --btn-hover: #e2e8f0;
      --shadow-sm: 0 4px 12px rgba(0, 0, 0, 0.02);
      --shadow-dropdown: 0 8px 24px rgba(0, 0, 0, 0.08);
      --accent: #2563eb;
      --accent-soft: #dbeafe;
      --card-bg: #ffffff;
      --quick-bg: #f1f5f9;
      --quick-hover: #e2e8f0;
      --add-btn-bg: #f1f5f9;
      --add-btn-hover: #e2e8f0;
    }

    .dark {
      --bg-page: #0f0f0f;
      --bg-surface: #1c1c1c;
      --bg-input: #252525;
      --bg-suggestion: #252525;
      --border-light: #333333;
      --border-focus: #60a5fa;
      --text-primary: #e8e8e8;
      --text-secondary: #b0b0b0;
      --text-muted: #6a6a6a;
      --btn-bg: #2a2a2a;
      --btn-hover: #383838;
      --shadow-sm: 0 4px 12px rgba(0, 0, 0, 0.4);
      --shadow-dropdown: 0 8px 24px rgba(0, 0, 0, 0.6);
      --accent: #3b82f6;
      --accent-soft: #1e3a5f;
      --card-bg: #1c1c1c;
      --quick-bg: #2a2a2a;
      --quick-hover: #383838;
      --add-btn-bg: #2a2a2a;
      --add-btn-hover: #383838;
    }

    body {
      background-color: var(--bg-page);
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }

    .main-container {
      width: 100%;
      max-width: 680px;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin-bottom: 2.5rem;
    }

    .brand-logo {
      width: 48px;
      height: 48px;
      object-fit: contain;
      border-radius: 10px;
    }

    .brand-name {
      font-size: 1.8rem;
      font-weight: 700;
      letter-spacing: -0.5px;
      color: var(--text-primary);
      user-select: none;
    }

    .search-wrapper {
      width: 100%;
      position: relative;
    }

    .search-form {
      display: flex;
      align-items: center;
      background: var(--bg-input);
      border: 1.5px solid var(--border-light);
      border-radius: 4rem;
      padding: 0.2rem 0.2rem 0.2rem 1.5rem;
      transition: border-color 0.15s, box-shadow 0.15s;
    }

    .search-form:focus-within {
      border-color: var(--border-focus);
      box-shadow: 0 0 0 4px var(--accent-soft);
    }

    .search-input {
      flex: 1;
      background: transparent;
      border: none;
      padding: 0.95rem 0.5rem 0.95rem 0;
      font-size: 1.1rem;
      color: var(--text-primary);
      outline: none;
      min-width: 0;
    }

    .search-input::placeholder {
      color: var(--text-muted);
      font-weight: 400;
    }

    .search-btn {
      background: var(--accent);
      border: none;
      border-radius: 4rem;
      padding: 0.8rem 1.8rem;
      font-size: 1rem;
      font-weight: 600;
      color: white;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.4rem;
      transition: background 0.15s, transform 0.1s;
      white-space: nowrap;
    }

    .search-btn:hover { background: #1d4ed8; }
    .search-btn:active { transform: scale(0.97); }

    .suggestions {
      position: absolute;
      top: calc(100% + 8px);
      left: 0;
      right: 0;
      background: var(--bg-suggestion);
      border: 1px solid var(--border-light);
      border-radius: 1.2rem;
      box-shadow: var(--shadow-dropdown);
      overflow: hidden;
      z-index: 10;
      opacity: 0;
      visibility: hidden;
      transform: translateY(-8px);
      transition: opacity 0.2s, transform 0.2s, visibility 0.2s;
    }

    .suggestions.visible {
      opacity: 1;
      visibility: visible;
      transform: translateY(0);
    }

    .suggestion-item {
      padding: 0.85rem 1.5rem;
      font-size: 0.95rem;
      color: var(--text-secondary);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.75rem;
      transition: background 0.12s;
    }

    .suggestion-item:hover {
      background: var(--btn-hover);
      color: var(--text-primary);
    }

    .suggestion-item .hot-tag {
      font-size: 0.7rem;
      background: var(--accent-soft);
      color: var(--accent);
      padding: 0.15rem 0.5rem;
      border-radius: 1rem;
      font-weight: 600;
      margin-left: auto;
    }

    .quick-links {
      display: flex;
      flex-wrap: wrap;
      gap: 0.6rem;
      margin-top: 1.8rem;
      justify-content: center;
      width: 100%;
    }

    .quick-link {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background: var(--quick-bg);
      border: 1px solid var(--border-light);
      border-radius: 3rem;
      padding: 0.5rem 1.1rem 0.5rem 0.6rem;
      font-size: 0.85rem;
      font-weight: 500;
      color: var(--text-secondary);
      text-decoration: none;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s, color 0.15s;
      position: relative;
    }

    .quick-link:hover {
      background: var(--quick-hover);
      border-color: var(--accent);
      color: var(--text-primary);
    }

    .quick-link .quick-icon {
      width: 24px;
      height: 24px;
      border-radius: 6px;
      object-fit: contain;
      flex-shrink: 0;
      background: transparent;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1rem;
      line-height: 1;
    }

    .quick-link .remove-quick {
      display: none;
      position: absolute;
      top: -6px;
      right: -6px;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: var(--text-muted);
      color: var(--bg-page);
      border: none;
      font-size: 0.7rem;
      line-height: 1;
      cursor: pointer;
      align-items: center;
      justify-content: center;
      font-weight: 700;
    }

    .quick-link:hover .remove-quick { display: flex; }

    .add-quick-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 2.5rem;
      height: 2.5rem;
      background: var(--add-btn-bg);
      border: 1.5px dashed var(--border-light);
      border-radius: 50%;
      cursor: pointer;
      font-size: 1.3rem;
      color: var(--text-muted);
      transition: background 0.15s, border-color 0.15s, color 0.15s;
      flex-shrink: 0;
    }

    .add-quick-btn:hover {
      background: var(--add-btn-hover);
      border-color: var(--accent);
      color: var(--accent);
    }

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.5);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 100;
      backdrop-filter: blur(2px);
    }

    .modal-overlay.open { display: flex; }

    .modal-box {
      background: var(--card-bg);
      border-radius: 1.5rem;
      padding: 2rem;
      width: 100%;
      max-width: 400px;
      box-shadow: var(--shadow-dropdown);
      border: 1px solid var(--border-light);
    }

    .modal-box h3 {
      margin-bottom: 1.5rem;
      font-size: 1.2rem;
      color: var(--text-primary);
    }

    .modal-box label {
      display: block;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text-secondary);
      margin-bottom: 0.4rem;
    }

    .modal-box input {
      width: 100%;
      padding: 0.75rem 1rem;
      margin-bottom: 1rem;
      border-radius: 0.8rem;
      border: 1px solid var(--border-light);
      background: var(--bg-input);
      color: var(--text-primary);
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.15s;
    }

    .modal-box input:focus { border-color: var(--border-focus); }

    .modal-actions {
      display: flex;
      gap: 0.75rem;
      justify-content: flex-end;
      margin-top: 0.5rem;
    }

    .modal-actions button {
      padding: 0.6rem 1.4rem;
      border-radius: 2rem;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      border: 1px solid var(--border-light);
      background: var(--btn-bg);
      color: var(--text-secondary);
      transition: background 0.15s;
    }

    .modal-actions button:hover { background: var(--btn-hover); }

    .modal-actions .confirm-btn {
      background: var(--accent);
      border-color: var(--accent);
      color: white;
    }

    .modal-actions .confirm-btn:hover { background: #1d4ed8; }

    .theme-toggle {
      position: fixed;
      top: 1.5rem;
      right: 1.5rem;
      display: flex;
      gap: 0.5rem;
      background: var(--btn-bg);
      padding: 0.3rem;
      border-radius: 3rem;
      border: 1px solid var(--border-light);
      z-index: 50;
    }

    .theme-btn {
      background: transparent;
      border: none;
      padding: 0.45rem 0.9rem;
      border-radius: 2rem;
      font-size: 0.8rem;
      font-weight: 500;
      color: var(--text-secondary);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.3rem;
      transition: all 0.15s;
    }

    .theme-btn.active {
      background: var(--accent);
      color: white;
    }

    .back-home-btn {
      position: fixed;
      top: 1.5rem;
      left: 1.5rem;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.5rem 1rem;
      border-radius: 2rem;
      background: var(--btn-bg);
      border: 1px solid var(--border-light);
      color: var(--text-secondary);
      font-size: 0.85rem;
      font-weight: 500;
      text-decoration: none;
      transition: background 0.15s, border-color 0.15s, color 0.15s;
      z-index: 50;
    }

    .back-home-btn:hover {
      background: var(--btn-hover);
      border-color: var(--accent);
      color: var(--text-primary);
    }

    /* ==================== 天气 + 时间信息区 (左下角，无卡片框) ==================== */
    .info-widget {
      position: fixed;
      left: 1.5rem;
      bottom: 1.5rem;
      width: 250px;
      z-index: 60;
      font-size: 0.8rem;
      color: var(--text-secondary);
    }

    /* 顶部时间日期行 */
    .info-datetime {
      display: flex;
      flex-direction: column;
      gap: 0.15rem;
      margin-bottom: 0.6rem;
    }

    .info-date-row {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-primary);
    }

    .date-format-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 0.7rem;
      padding: 1px 4px;
      border-radius: 4px;
      transition: background 0.15s, color 0.15s;
      line-height: 1;
    }

    .date-format-btn:hover {
      background: var(--btn-hover);
      color: var(--accent);
    }

    .info-time-row {
      font-size: 0.75rem;
      color: var(--text-muted);
      font-weight: 400;
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
    }

    /* 天气行 */
    .info-weather {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      margin-top: 0.3rem;
      flex-wrap: wrap;
    }

    .weather-icon-img {
      width: 36px;
      height: 36px;
      object-fit: contain;
      flex-shrink: 0;
    }

    .weather-temp-text {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--text-primary);
      line-height: 1;
      letter-spacing: -0.5px;
    }

    .weather-detail-text {
      font-size: 0.68rem;
      color: var(--text-muted);
      line-height: 1.4;
    }

    .weather-detail-text span {
      display: inline-block;
      margin-right: 0.6rem;
      white-space: nowrap;
    }

    .weather-detail-text span strong {
      color: var(--text-secondary);
      font-weight: 600;
    }

    /* 定位询问 / 手动输入 (无框，纯文本) */
    .info-consent {
      margin-top: 0.5rem;
      font-size: 0.7rem;
      color: var(--text-muted);
      line-height: 1.5;
    }

    .info-consent-actions {
      display: flex;
      gap: 0.5rem;
      margin-top: 0.3rem;
      flex-wrap: wrap;
    }

    .info-consent-actions button {
      background: transparent;
      border: none;
      color: var(--accent);
      cursor: pointer;
      font-size: 0.7rem;
      font-weight: 600;
      padding: 0;
      text-decoration: underline;
      text-underline-offset: 2px;
    }

    .info-consent-actions button:hover {
      color: var(--accent-hover, #1d4ed8);
      opacity: 0.85;
    }

    .info-manual-input {
      display: flex;
      gap: 0.3rem;
      margin-top: 0.3rem;
    }

    .info-manual-input input {
      flex: 1;
      padding: 0.25rem 0.4rem;
      border: 1px solid var(--border-light);
      border-radius: 4px;
      background: var(--bg-input);
      color: var(--text-primary);
      font-size: 0.7rem;
      outline: none;
      min-width: 0;
    }

    .info-manual-input input:focus {
      border-color: var(--border-focus);
    }

    .info-manual-input button {
      padding: 0.25rem 0.5rem;
      border: none;
      border-radius: 4px;
      background: var(--accent);
      color: white;
      font-size: 0.7rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
    }

    .weather-status-text {
      font-size: 0.7rem;
      color: var(--text-muted);
      margin-top: 0.3rem;
    }

    .weather-status-text.error {
      color: #ef4444;
    }

    /* 隐藏/显示切换按钮 (信息区右上角小按钮) */
    .info-toggle-btn {
      position: absolute;
      top: -1.4rem;
      right: 0;
      background: transparent;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 0.65rem;
      padding: 2px 6px;
      border-radius: 4px;
      transition: background 0.15s, color 0.15s;
    }

    .info-toggle-btn:hover {
      background: var(--btn-hover);
      color: var(--accent);
    }

    /* 信息区收起状态 */
    .info-widget.collapsed .info-datetime,
    .info-widget.collapsed .info-weather,
    .info-widget.collapsed .info-consent,
    .info-widget.collapsed .weather-status-text {
      display: none;
    }

    .info-widget.collapsed {
      width: auto;
    }

    .info-widget.collapsed .info-toggle-btn {
      position: static;
      font-size: 0.7rem;
      text-decoration: underline;
      text-underline-offset: 2px;
    }

    @media (max-width: 520px) {
      .brand-name { font-size: 1.4rem; }
      .brand-logo { width: 38px; height: 38px; }
      .search-btn { padding: 0.8rem 1.2rem; }
      .theme-toggle { top: 0.8rem; right: 0.8rem; }
      .theme-btn { padding: 0.35rem 0.6rem; font-size: 0.7rem; }
      .back-home-btn {
        top: 0.8rem; left: 0.8rem;
        padding: 0.35rem 0.7rem; font-size: 0.75rem;
      }
      .info-widget {
        left: 0.8rem;
        bottom: 0.8rem;
        width: 210px;
        font-size: 0.72rem;
      }
      .weather-temp-text { font-size: 1.2rem; }
      .weather-icon-img { width: 28px; height: 28px; }
    }
  </style>
</head>
<body class="light">

  <a href="#" id="backHomeBtn" class="back-home-btn">← 首页</a>

  <div class="theme-toggle" role="group" aria-label="主题切换">
    <button class="theme-btn active" data-theme="light" id="lightBtn">☀️ 浅色</button>
    <button class="theme-btn" data-theme="dark" id="darkBtn">🌙 深色</button>
  </div>

  <div class="main-container">
    <div class="brand">
      <img src="https://www.google.com/s2/favicons?domain=azen.dev&sz=128"
           alt="azen.dev Logo"
           class="brand-logo"
           onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Crect width=%22100%22 height=%22100%22 rx=%2220%22 fill=%22%233b82f6%22/%3E%3Ctext x=%2250%22 y=%2268%22 font-family=%22Arial%22 font-size=%2252%22 font-weight=%22bold%22 fill=%22white%22 text-anchor=%22middle%22%3EN%3C/text%3E%3C/svg%3E'">
      <span class="brand-name">NVazen</span>
    </div>

    <div class="search-wrapper">
      <form class="search-form" id="searchForm" action="https://www.google.com/search" method="GET" target="_blank">
        <input type="text" class="search-input" id="searchInput" name="q" placeholder="搜索你想找的内容…" autocomplete="off" autofocus>
        <button type="submit" class="search-btn">搜索 →</button>
      </form>
      <div class="suggestions" id="suggestionsBox"></div>
    </div>

    <div class="quick-links" id="quickLinksContainer"></div>
  </div>

  <!-- ==================== 左下角信息区 (时间 + 天气，无卡片框) ==================== -->
  <div class="info-widget" id="infoWidget">
    <button class="info-toggle-btn" id="infoToggleBtn" title="显示/隐藏">隐藏</button>

    <!-- 时间日期 -->
    <div class="info-datetime">
      <div class="info-date-row">
        <span id="dateDisplay">2026/10/27</span>
        <button class="date-format-btn" id="dateFormatBtn" title="切换日期格式">⇄</button>
      </div>
      <div class="info-time-row">
        <span id="weekdayDisplay">周一</span>
        <span id="timeDisplay">00:00:00</span>
      </div>
    </div>

    <!-- 天气 -->
    <div class="info-weather" id="weatherDisplay">
      <div class="weather-status-text" id="weatherStatus">正在加载天气…</div>
    </div>

    <!-- 定位询问 / 手动输入 -->
    <div class="info-consent" id="weatherConsentArea"></div>
  </div>

  <!-- 添加快捷方式弹窗 -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal-box">
      <h3>添加快捷方式</h3>
      <label for="quickName">名称</label>
      <input type="text" id="quickName" placeholder="例如：GitHub" maxlength="20">
      <label for="quickUrl">URL</label>
      <input type="url" id="quickUrl" placeholder="https://github.com">
      <div class="modal-actions">
        <button id="cancelAdd">取消</button>
        <button class="confirm-btn" id="confirmAdd">添加</button>
      </div>
    </div>
  </div>

  <script>
    (function() {
      // =====================================================
      // 路径检测 & 返回首页
      // =====================================================
      const path = window.location.pathname;
      const isSubDir = path.includes('/search');
      const homeHref = isSubDir ? '../index.html' : 'index.html';
      const backBtn = document.getElementById('backHomeBtn');
      backBtn.setAttribute('href', homeHref);

      // =====================================================
      // 多语言适配 (记忆)
      // =====================================================
      const STORAGE_LANG = 'nvazen_search_lang';
      let savedLang = null;
      try { savedLang = localStorage.getItem(STORAGE_LANG); } catch(e) {}

      const userLang = savedLang || navigator.language || navigator.userLanguage || 'en';
      const isZh = userLang.startsWith('zh');

      const i18n = {
        zh: {
          placeholder: '搜索你想找的内容…',
          searchBtn: '搜索 →',
          addQuick: '添加快捷方式',
          quickName: '名称',
          quickUrl: 'URL',
          namePlaceholder: '例如：GitHub',
          urlPlaceholder: 'https://github.com',
          cancel: '取消',
          confirm: '添加',
          emptyName: '请输入名称',
          emptyUrl: '请输入URL',
          invalidUrl: '请输入有效的URL',
          backHome: '← 首页',
          weekdays: ['周日','周一','周二','周三','周四','周五','周六'],
          weatherAllow: '允许定位',
          weatherDeny: '手动选择',
          weatherConsent: '是否允许定位以显示当地天气？',
          weatherManualPlaceholder: '输入城市名，如 Sydney',
          weatherManualConfirm: '确认',
          weatherLoading: '正在加载天气…',
          weatherError: '天气加载失败',
          weatherFeelsLike: '体感',
          weatherHumidity: '湿度',
          weatherWind: '风速',
          weatherPressure: '气压',
          weatherCloud: '云量',
          weatherPrecip: '降水',
          weatherDefaultNote: '默认位置：悉尼',
          hide: '隐藏',
          show: '显示'
        },
        en: {
          placeholder: 'Search anything…',
          searchBtn: 'Search →',
          addQuick: 'Add shortcut',
          quickName: 'Name',
          quickUrl: 'URL',
          namePlaceholder: 'e.g. GitHub',
          urlPlaceholder: 'https://github.com',
          cancel: 'Cancel',
          confirm: 'Add',
          emptyName: 'Please enter a name',
          emptyUrl: 'Please enter a URL',
          invalidUrl: 'Please enter a valid URL',
          backHome: '← Home',
          weekdays: ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'],
          weatherAllow: 'Allow location',
          weatherDeny: 'Choose manually',
          weatherConsent: 'Allow location for local weather?',
          weatherManualPlaceholder: 'Enter city, e.g. Sydney',
          weatherManualConfirm: 'Go',
          weatherLoading: 'Loading weather…',
          weatherError: 'Weather unavailable',
          weatherFeelsLike: 'Feels',
          weatherHumidity: 'Humidity',
          weatherWind: 'Wind',
          weatherPressure: 'Pressure',
          weatherCloud: 'Cloud',
          weatherPrecip: 'Precip',
          weatherDefaultNote: 'Default: Sydney',
          hide: 'Hide',
          show: 'Show'
        }
      };

      let currentLang = isZh ? 'zh' : 'en';
      const t = i18n[currentLang];

      function applyI18n() {
        document.getElementById('searchInput').placeholder = t.placeholder;
        document.querySelector('.search-btn').textContent = t.searchBtn;
        document.querySelector('.modal-box h3').textContent = t.addQuick;
        document.querySelectorAll('.modal-box label')[0].textContent = t.quickName;
        document.querySelectorAll('.modal-box label')[1].textContent = t.quickUrl;
        document.getElementById('quickName').placeholder = t.namePlaceholder;
        document.getElementById('quickUrl').placeholder = t.urlPlaceholder;
        document.getElementById('cancelAdd').textContent = t.cancel;
        document.getElementById('confirmAdd').textContent = t.confirm;
        backBtn.textContent = t.backHome;
      }
      applyI18n();

      // =====================================================
      // 主题切换 (记忆)
      // =====================================================
      const body = document.body;
      const lightBtn = document.getElementById('lightBtn');
      const darkBtn = document.getElementById('darkBtn');
      const STORAGE_THEME = 'nvazen_search_theme';

      function setTheme(theme) {
        body.classList.remove('light', 'dark');
        body.classList.add(theme);
        lightBtn.classList.toggle('active', theme === 'light');
        darkBtn.classList.toggle('active', theme === 'dark');
        try { localStorage.setItem(STORAGE_THEME, theme); } catch(e) {}
      }

      try {
        const savedTheme = localStorage.getItem(STORAGE_THEME);
        if (savedTheme === 'light' || savedTheme === 'dark') {
          setTheme(savedTheme);
        } else {
          const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          setTheme(prefersDark ? 'dark' : 'light');
        }
      } catch(e) { setTheme('light'); }

      lightBtn.addEventListener('click', () => setTheme('light'));
      darkBtn.addEventListener('click', () => setTheme('dark'));

      // =====================================================
      // 搜索引擎 (记忆)
      // =====================================================
      const engines = {
        google:  { action: 'https://www.google.com/search', param: 'q' },
        bing:    { action: 'https://www.bing.com/search',   param: 'q' },
        ddg:     { action: 'https://duckduckgo.com/',       param: 'q' }
      };

      const STORAGE_ENGINE = 'nvazen_search_engine';
      let currentEngine = 'google';
      const searchForm = document.getElementById('searchForm');
      const searchInput = document.getElementById('searchInput');

      function setEngine(key) {
        if (!engines[key]) return;
        currentEngine = key;
        searchForm.action = engines[key].action;
        searchInput.name = engines[key].param;
        try { localStorage.setItem(STORAGE_ENGINE, key); } catch(e) {}
      }

      try {
        const savedEngine = localStorage.getItem(STORAGE_ENGINE);
        if (savedEngine && engines[savedEngine]) setEngine(savedEngine);
      } catch(e) {}

      // =====================================================
      // 热门搜索建议
      // =====================================================
      const suggestionsBox = document.getElementById('suggestionsBox');
      const hotSearches = currentLang === 'zh'
        ? ['今日天气', '新闻头条', 'AI 最新进展', 'Python 教程', '附近美食', '汇率换算']
        : ['Weather today', 'Latest news', 'AI breakthroughs', 'Python tutorial', 'Restaurants nearby', 'Currency converter'];

      function renderSuggestions() {
        suggestionsBox.innerHTML = hotSearches.map((item, idx) => `
          <div class="suggestion-item" data-query="${item}">
            <span>🔍</span>
            <span>${item}</span>
            ${idx < 3 ? `<span class="hot-tag">${currentLang === 'zh' ? '热门' : 'Hot'}</span>` : ''}
          </div>
        `).join('');
      }
      renderSuggestions();

      suggestionsBox.addEventListener('click', (e) => {
        const item = e.target.closest('.suggestion-item');
        if (!item) return;
        searchInput.value = item.dataset.query;
        searchForm.submit();
        hideSuggestions();
      });

      function showSuggestions() { suggestionsBox.classList.add('visible'); }
      function hideSuggestions() { suggestionsBox.classList.remove('visible'); }

      searchInput.addEventListener('focus', showSuggestions);
      document.addEventListener('click', (e) => {
        if (!e.target.closest('.search-wrapper')) hideSuggestions();
      });
      searchInput.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') { hideSuggestions(); searchInput.blur(); }
      });

      // =====================================================
      // URL 检测 & 直接跳转
      // =====================================================
      function isUrl(str) {
        const urlPattern = /^(https?:\/\/)?([\w-]+\.)+[\w-]+(\/[\w-./?%&=]*)?$/i;
        return urlPattern.test(str.trim());
      }

      function normalizeUrl(str) {
        let url = str.trim();
        if (!/^https?:\/\//i.test(url)) url = 'https://' + url;
        return url;
      }

      searchForm.addEventListener('submit', (e) => {
        const value = searchInput.value.trim();
        if (value === '') {
          e.preventDefault();
          searchInput.focus();
          searchInput.placeholder = currentLang === 'zh' ? '请输入搜索内容…' : 'Please enter something…';
          setTimeout(() => { searchInput.placeholder = t.placeholder; }, 1500);
          return;
        }
        if (isUrl(value)) {
          e.preventDefault();
          window.open(normalizeUrl(value), '_blank');
          hideSuggestions();
          return;
        }
        hideSuggestions();
      });

      // =====================================================
      // 快捷选项 (记忆 + 图标)
      // =====================================================
      const quickLinksContainer = document.getElementById('quickLinksContainer');
      const modalOverlay = document.getElementById('modalOverlay');
      const quickNameInput = document.getElementById('quickName');
      const quickUrlInput = document.getElementById('quickUrl');
      const cancelAddBtn = document.getElementById('cancelAdd');
      const confirmAddBtn = document.getElementById('confirmAdd');

      const STORAGE_QUICKLINKS = 'nvazen_search_quicklinks';
      const defaultQuickLinks = [
        { name: 'GitHub', url: 'https://github.com' },
        { name: 'YouTube', url: 'https://youtube.com' },
        { name: 'Gmail', url: 'https://mail.google.com' },
        { name: 'Reddit', url: 'https://reddit.com' }
      ];

      let quickLinks = [];

      function getFaviconUrl(linkUrl) {
        try {
          const url = new URL(linkUrl);
          return `https://www.google.com/s2/favicons?domain=${url.hostname}&sz=64`;
        } catch(e) { return ''; }
      }

      function loadQuickLinks() {
        try {
          const saved = localStorage.getItem(STORAGE_QUICKLINKS);
          if (saved) { quickLinks = JSON.parse(saved); }
          else { quickLinks = [...defaultQuickLinks]; }
        } catch(e) { quickLinks = [...defaultQuickLinks]; }
      }

      function saveQuickLinks() {
        try { localStorage.setItem(STORAGE_QUICKLINKS, JSON.stringify(quickLinks)); } catch(e) {}
      }

      function renderQuickLinks() {
        quickLinksContainer.innerHTML = '';
        quickLinks.forEach((link, index) => {
          const a = document.createElement('a');
          a.className = 'quick-link';
          a.href = link.url;
          a.target = '_blank';
          a.rel = 'noopener noreferrer';

          const faviconUrl = getFaviconUrl(link.url);
          const iconImg = document.createElement('img');
          iconImg.className = 'quick-icon';
          iconImg.src = faviconUrl;
          iconImg.alt = link.name;
          iconImg.loading = 'lazy';
          iconImg.onerror = function() {
            this.style.display = 'none';
            const fallback = document.createElement('span');
            fallback.className = 'quick-icon';
            fallback.textContent = link.name.charAt(0).toUpperCase();
            fallback.style.background = 'var(--accent)';
            fallback.style.color = 'white';
            fallback.style.fontSize = '0.8rem';
            fallback.style.fontWeight = '700';
            this.parentNode.insertBefore(fallback, this);
          };

          const nameSpan = document.createElement('span');
          nameSpan.textContent = link.name;

          const removeBtn = document.createElement('button');
          removeBtn.className = 'remove-quick';
          removeBtn.dataset.index = index;
          removeBtn.title = currentLang === 'zh' ? '删除' : 'Remove';
          removeBtn.textContent = '×';

          a.appendChild(iconImg);
          a.appendChild(nameSpan);
          a.appendChild(removeBtn);
          quickLinksContainer.appendChild(a);
        });

        const addBtn = document.createElement('button');
        addBtn.className = 'add-quick-btn';
        addBtn.innerHTML = '+';
        addBtn.title = t.addQuick;
        addBtn.addEventListener('click', openModal);
        quickLinksContainer.appendChild(addBtn);
      }

      quickLinksContainer.addEventListener('click', (e) => {
        const removeBtn = e.target.closest('.remove-quick');
        if (!removeBtn) return;
        e.preventDefault();
        e.stopPropagation();
        const idx = parseInt(removeBtn.dataset.index, 10);
        if (!isNaN(idx) && idx >= 0 && idx < quickLinks.length) {
          quickLinks.splice(idx, 1);
          saveQuickLinks();
          renderQuickLinks();
        }
      });

      function openModal() {
        modalOverlay.classList.add('open');
        quickNameInput.value = '';
        quickUrlInput.value = '';
        quickNameInput.focus();
      }

      function closeModal() { modalOverlay.classList.remove('open'); }

      cancelAddBtn.addEventListener('click', closeModal);
      modalOverlay.addEventListener('click', (e) => {
        if (e.target === modalOverlay) closeModal();
      });

      confirmAddBtn.addEventListener('click', () => {
        const name = quickNameInput.value.trim();
        const url = quickUrlInput.value.trim();
        if (!name) { alert(t.emptyName); quickNameInput.focus(); return; }
        if (!url) { alert(t.emptyUrl); quickUrlInput.focus(); return; }
        try { new URL(url); } catch(e) { alert(t.invalidUrl); quickUrlInput.focus(); return; }
        quickLinks.push({ name, url });
        saveQuickLinks();
        renderQuickLinks();
        closeModal();
      });

      quickNameInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') { e.preventDefault(); quickUrlInput.focus(); }
      });
      quickUrlInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') { e.preventDefault(); confirmAddBtn.click(); }
      });

      loadQuickLinks();
      renderQuickLinks();

      // =====================================================
      // 日期 / 时间动态显示 + 三种日期格式
      // =====================================================
      const dateDisplay = document.getElementById('dateDisplay');
      const weekdayDisplay = document.getElementById('weekdayDisplay');
      const timeDisplay = document.getElementById('timeDisplay');
      const dateFormatBtn = document.getElementById('dateFormatBtn');
      const STORAGE_DATE_FORMAT = 'nvazen_date_format';

      // 三种日期格式：
      // 0: YYYY/MM/DD
      // 1: DD/MM/YYYY
      // 2: MM/DD/YYYY
      let currentDateFormat = 0;
      try {
        const savedFmt = localStorage.getItem(STORAGE_DATE_FORMAT);
        if (savedFmt !== null) {
          const n = parseInt(savedFmt, 10);
          if (n >= 0 && n <= 2) currentDateFormat = n;
        }
      } catch(e) {}

      function pad(n) { return n < 10 ? '0' + n : '' + n; }

      function formatDate(date, format) {
        const y = date.getFullYear();
        const m = pad(date.getMonth() + 1);
        const d = pad(date.getDate());
        if (format === 0) return `${y}/${m}/${d}`;
        if (format === 1) return `${d}/${m}/${y}`;
        return `${m}/${d}/${y}`;
      }

      function updateDateTime() {
        const now = new Date();
        dateDisplay.textContent = formatDate(now, currentDateFormat);
        weekdayDisplay.textContent = t.weekdays[now.getDay()];
        timeDisplay.textContent = `${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;
      }

      dateFormatBtn.addEventListener('click', () => {
        currentDateFormat = (currentDateFormat + 1) % 3;
        try { localStorage.setItem(STORAGE_DATE_FORMAT, currentDateFormat); } catch(e) {}
        updateDateTime();
      });

      updateDateTime();
      setInterval(updateDateTime, 1000);

      // =====================================================
      // 信息区显示/隐藏
      // =====================================================
      const infoWidget = document.getElementById('infoWidget');
      const infoToggleBtn = document.getElementById('infoToggleBtn');
      const STORAGE_INFO_VISIBLE = 'nvazen_info_visible';

      function setInfoVisible(visible) {
        infoWidget.classList.toggle('collapsed', !visible);
        infoToggleBtn.textContent = visible ? t.hide : t.show;
        try { localStorage.setItem(STORAGE_INFO_VISIBLE, visible ? '1' : '0'); } catch(e) {}
      }

      try {
        const savedVisible = localStorage.getItem(STORAGE_INFO_VISIBLE);
        // 默认显示
        setInfoVisible(savedVisible !== '0');
      } catch(e) { setInfoVisible(true); }

      infoToggleBtn.addEventListener('click', () => {
        const isVisible = !infoWidget.classList.contains('collapsed');
        setInfoVisible(!isVisible);
      });

      // =====================================================
      // 天气模块 (无卡片框，纯文本 + 本地 SVG 图标)
      // =====================================================
      const weatherDisplay = document.getElementById('weatherDisplay');
      const weatherConsentArea = document.getElementById('weatherConsentArea');

      const DEFAULT_LAT = -33.8688;
      const DEFAULT_LON = 151.2093;
      const DEFAULT_LOCATION_NAME = 'Sydney';
      const STORAGE_WEATHER_LOC = 'nvazen_weather_location';
      const STORAGE_WEATHER_CONSENT = 'nvazen_weather_consent';

      let currentWeatherLocation = null;

      // 天气代码 → 图标文件映射
      // sunny.svg / half-sunny.svg / raining.svg
      function getWeatherIconFile(code) {
        // 晴 / 大部晴朗 → sunny
        if (code === 0 || code === 1) return 'sunny.svg';
        // 多云 / 阴 / 雾 / 雾凇 → half-sunny
        if (code === 2 || code === 3 || code === 45 || code === 48) return 'half-sunny.svg';
        // 毛毛雨 / 雨 / 阵雨 / 雪 / 雷暴 → raining
        if (code >= 51) return 'raining.svg';
        return 'sunny.svg';
      }

      // 天气代码 → 文字描述
      function getWeatherDesc(code) {
        const zh = {
          0: '晴', 1: '大部晴朗', 2: '多云', 3: '阴',
          45: '雾', 48: '雾凇',
          51: '小毛毛雨', 53: '毛毛雨', 55: '密集毛毛雨',
          61: '小雨', 63: '中雨', 65: '大雨',
          71: '小雪', 73: '中雪', 75: '大雪',
          80: '小阵雨', 81: '中阵雨', 82: '强阵雨',
          95: '雷暴', 96: '雷暴伴冰雹', 99: '雷暴伴强冰雹'
        };
        const en = {
          0: 'Clear', 1: 'Mainly clear', 2: 'Partly cloudy', 3: 'Overcast',
          45: 'Fog', 48: 'Rime fog',
          51: 'Light drizzle', 53: 'Drizzle', 55: 'Dense drizzle',
          61: 'Light rain', 63: 'Rain', 65: 'Heavy rain',
          71: 'Light snow', 73: 'Snow', 75: 'Heavy snow',
          80: 'Light showers', 81: 'Showers', 82: 'Violent showers',
          95: 'Thunderstorm', 96: 'Thunderstorm + hail', 99: 'Thunderstorm + heavy hail'
        };
        const map = currentLang === 'zh' ? zh : en;
        return map[code] || (currentLang === 'zh' ? '未知' : 'Unknown');
      }

      function loadSavedLocation() {
        try {
          const saved = localStorage.getItem(STORAGE_WEATHER_LOC);
          if (saved) {
            const loc = JSON.parse(saved);
            if (loc && loc.lat && loc.lon) {
              currentWeatherLocation = loc;
              return true;
            }
          }
        } catch(e) {}
        return false;
      }

      function saveLocation(lat, lon, name) {
        currentWeatherLocation = { lat, lon, name };
        try {
          localStorage.setItem(STORAGE_WEATHER_LOC, JSON.stringify({ lat, lon, name }));
        } catch(e) {}
      }

      async function fetchWeather(lat, lon) {
        weatherDisplay.innerHTML = `<div class="weather-status-text">${t.weatherLoading}</div>`;
        try {
          const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,relative_humidity_2m,apparent_temperature,precipitation,weather_code,cloud_cover,pressure_msl,wind_speed_10m&timezone=auto`;
          const res = await fetch(url);
          if (!res.ok) throw new Error('Weather fetch failed');
          const data = await res.json();
          renderWeather(data.current);
        } catch(err) {
          weatherDisplay.innerHTML = `<div class="weather-status-text error">${t.weatherError}</div>`;
        }
      }

      function renderWeather(current) {
        if (!current) {
          weatherDisplay.innerHTML = `<div class="weather-status-text error">${t.weatherError}</div>`;
          return;
        }
        const temp = Math.round(current.temperature_2m);
        const feelsLike = Math.round(current.apparent_temperature);
        const humidity = current.relative_humidity_2m;
        const windSpeed = current.wind_speed_10m;
        const pressure = Math.round(current.pressure_msl);
        const cloud = current.cloud_cover;
        const precip = current.precipitation;
        const code = current.weather_code;
        const iconFile = getWeatherIconFile(code);
        const desc = getWeatherDesc(code);

        weatherDisplay.innerHTML = `
          <img class="weather-icon-img" src="${iconFile}" alt="${desc}">
          <div>
            <div style="display:flex;align-items:baseline;gap:0.3rem;">
              <span class="weather-temp-text">${temp}°C</span>
              <span style="font-size:0.7rem;color:var(--text-muted);">${desc}</span>
            </div>
            <div class="weather-detail-text">
              <span><strong>${t.weatherFeelsLike}</strong> ${feelsLike}°</span>
              <span><strong>${t.weatherHumidity}</strong> ${humidity}%</span>
              <span><strong>${t.weatherWind}</strong> ${windSpeed}km/h</span>
              <span><strong>${t.weatherPressure}</strong> ${pressure}hPa</span>
              <span><strong>${t.weatherCloud}</strong> ${cloud}%</span>
              <span><strong>${t.weatherPrecip}</strong> ${precip}mm</span>
            </div>
          </div>
        `;
      }

      function showConsentUI() {
        weatherConsentArea.innerHTML = `
          <div>${t.weatherConsent}</div>
          <div class="info-consent-actions">
            <button id="weatherAllowBtn">${t.weatherAllow}</button>
            <button id="weatherManualBtn">${t.weatherDeny}</button>
          </div>
        `;
        document.getElementById('weatherAllowBtn').addEventListener('click', handleAllowLocation);
        document.getElementById('weatherManualBtn').addEventListener('click', showManualInput);
      }

      function handleAllowLocation() {
        weatherConsentArea.innerHTML = '';
        try { localStorage.setItem(STORAGE_WEATHER_CONSENT, 'granted'); } catch(e) {}
        if (!navigator.geolocation) {
          weatherDisplay.innerHTML = `<div class="weather-status-text error">Geolocation not supported</div>`;
          return;
        }
        weatherDisplay.innerHTML = `<div class="weather-status-text">${t.weatherLoading}</div>`;
        navigator.geolocation.getCurrentPosition(
          (pos) => {
            const { latitude, longitude } = pos.coords;
            saveLocation(latitude, longitude, 'My location');
            fetchWeather(latitude, longitude);
          },
          () => { fallbackToDefault(); },
          { timeout: 8000 }
        );
      }

      function showManualInput() {
        weatherConsentArea.innerHTML = `
          <div style="margin-bottom:0.2rem;">${t.weatherManualPlaceholder}</div>
          <div class="info-manual-input">
            <input type="text" id="weatherManualInput" placeholder="Sydney" value="">
            <button id="weatherManualConfirm">${t.weatherManualConfirm}</button>
          </div>
          <div style="font-size:0.62rem;color:var(--text-muted);margin-top:0.2rem;">${t.weatherDefaultNote}</div>
        `;
        const input = document.getElementById('weatherManualInput');
        const confirmBtn = document.getElementById('weatherManualConfirm');
        input.focus();
        const doSearch = async () => {
          const name = input.value.trim();
          if (!name) return;
          weatherConsentArea.innerHTML = '';
          try { localStorage.setItem(STORAGE_WEATHER_CONSENT, 'manual'); } catch(e) {}
          weatherDisplay.innerHTML = `<div class="weather-status-text">${t.weatherLoading}</div>`;
          try {
            const geoRes = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(name)}&count=1&language=${currentLang}`);
            const geoData = await geoRes.json();
            if (geoData.results && geoData.results.length > 0) {
              const r = geoData.results[0];
              saveLocation(r.latitude, r.longitude, r.name);
              fetchWeather(r.latitude, r.longitude);
            } else {
              fallbackToDefault();
            }
          } catch(e) {
            fallbackToDefault();
          }
        };
        confirmBtn.addEventListener('click', doSearch);
        input.addEventListener('keydown', (e) => { if (e.key === 'Enter') doSearch(); });
      }

      function fallbackToDefault() {
        saveLocation(DEFAULT_LAT, DEFAULT_LON, DEFAULT_LOCATION_NAME);
        fetchWeather(DEFAULT_LAT, DEFAULT_LON);
      }

      function initWeather() {
        const hasSaved = loadSavedLocation();
        const consent = localStorage.getItem(STORAGE_WEATHER_CONSENT);

        if (hasSaved && currentWeatherLocation) {
          fetchWeather(currentWeatherLocation.lat, currentWeatherLocation.lon);
        } else if (consent === 'granted') {
          handleAllowLocation();
        } else if (consent === 'denied' || consent === 'manual') {
          fallbackToDefault();
        } else {
          weatherDisplay.innerHTML = `<div class="weather-status-text">${t.weatherDefaultNote}</div>`;
          showConsentUI();
        }
      }

      initWeather();

    })();
  </script>
</body>
</html>
