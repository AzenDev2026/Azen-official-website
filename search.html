<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search — NVazen™ Linux</title>
    <meta name="description" content="NVazen search portal: search the web, quick links, clock and local weather.">
    <meta name="robots" content="index, follow">
    <link rel="canonical" href="https://azen.dev/search.html">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon.png">
    <link rel="apple-touch-icon" sizes="180x180" href="icon.png">
    <link rel="stylesheet" href="assets/css/base.css">
    <link rel="stylesheet" href="assets/css/search.css">
</head>
<body data-bg-effect="full">

<header>
    <div class="container nav-bar">
        <div style="display:flex;align-items:center;gap:14px;">
            <a class="brand" href="index.html" aria-label="NVazen Linux home">
                <img src="icon.png" alt="NVazen Linux">
                <span>NVazen<span class="tm">™</span> Linux</span>
            </a>
            <span class="update-counter" data-i18n="update_counter">update 27</span>
        </div>

        <nav class="nav-links" aria-label="Primary">
            <a href="index.html" class="nav-link" data-nav="index.html" data-i18n="nav_news">News</a>
            <a href="downloads.html" class="nav-link" data-nav="downloads.html" data-i18n="nav_download">Download</a>
            <a href="distro.html" class="nav-link" data-nav="distro.html" data-i18n="nav_distros">Distros</a>
            <a href="search.html" class="nav-link" data-nav="search.html" data-i18n="nav_search">Search</a>
            <a href="support.html" class="nav-link" data-nav="support.html" data-i18n="nav_repos">GitHub</a>
        </nav>

        <div class="nav-right">
            <div class="settings-wrapper">
                <button class="icon-btn" id="settingsBtn" title="Settings" aria-label="Settings">⚙️</button>
                <div class="settings-menu" id="settingsMenu">
                    <div class="settings-group">
                        <span class="settings-group-label" data-i18n="settings_language">Language</span>
                        <div class="settings-group-options">
                            <button class="opt-btn active" data-lang-opt="en">English</button>
                            <button class="opt-btn" data-lang-opt="zh">简体中文</button>
                            <button class="opt-btn" data-lang-opt="ja">日本語</button>
                            <button class="opt-btn" data-lang-opt="ko">한국어</button>
                        </div>
                    </div>
                    <div class="settings-group">
                        <span class="settings-group-label" data-i18n="settings_theme">Theme</span>
                        <div class="settings-group-options">
                            <button class="opt-btn active" data-theme-opt="dark">🌙 <span data-i18n="theme_dark">Dark</span></button>
                            <button class="opt-btn" data-theme-opt="light">☀️ <span data-i18n="theme_light">Light</span></button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</header>

<div class="search-main">
    <a class="brand-big" href="index.html">
        <img src="icon.png" alt="NVazen logo">
        <span class="brand-name">NVazen</span>
    </a>

    <div class="search-wrapper">
        <form class="search-form" id="searchForm" action="https://www.google.com/search" method="GET" target="_blank">
            <input type="text" class="search-input" id="searchInput" name="q" placeholder="搜索你想找的内容…" autocomplete="off" autofocus>
            <button type="submit" class="search-btn">搜索 →</button>
        </form>
        <div class="suggestions" id="suggestionsBox"></div>
    </div>

    <div class="quick-links" id="quickLinksContainer"></div>
</div>

<!-- 左下角信息区 (时间 + 天气) -->
<div class="info-widget" id="infoWidget">
    <button class="info-toggle-btn" id="infoToggleBtn" title="显示/隐藏">隐藏</button>

    <div class="info-datetime">
        <div class="info-date-row">
            <span id="dateDisplay">2026/11/12</span>
            <button class="date-format-btn" id="dateFormatBtn" title="切换日期格式">⇄</button>
        </div>
        <div class="info-time-row">
            <span id="weekdayDisplay">—</span>
            <span id="timeDisplay">00:00:00</span>
        </div>
    </div>

    <div class="info-weather" id="weatherDisplay">
        <div class="weather-status-text">正在加载天气…</div>
    </div>

    <div class="info-consent" id="weatherConsentArea"></div>
</div>

<!-- 添加快捷方式弹窗 -->
<div class="modal-overlay" id="modalOverlay">
    <div class="modal-box">
        <h3>添加快捷方式</h3>
        <label for="quickName">名称</label>
        <input type="text" id="quickName" placeholder="例如：GitHub" maxlength="20">
        <label for="quickUrl">URL</label>
        <input type="url" id="quickUrl" placeholder="https://github.com">
        <div class="modal-actions">
            <button id="cancelAdd">取消</button>
            <button class="confirm-btn" id="confirmAdd">添加</button>
        </div>
    </div>
</div>

<footer>
    <div class="container footer-grid">
        <div>
            <p><strong>© 2026 梁子珽</strong> <span data-i18n="footer_original">· 原创作品</span></p>
            <p>NVazen<span class="tm">™</span> Linux — <span data-i18n="footer_brand">基于 Arch Linux 的定制发行版</span></p>
            <p data-i18n="footer_gpl">遵守 GPLv3 开源协议</p>
        </div>
        <div class="footer-note">
            <p data-i18n="footer_note">本系统基于 Arch Linux，所有修改及衍生代码遵循 GPLv3。</p>
            <p style="margin-top:8px;" data-i18n="footer_repo">GitHub 仓库 · 开源共建</p>
        </div>
    </div>
</footer>

<script src="assets/js/i18n.js"></script>
<script src="assets/js/site.js"></script>
<script src="assets/js/search.js"></script>
</body>
</html>
